<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e8">
  <meta name="description" content="CFSM Visitor Pass registration and digital visitor pass.">
  <meta name="color-scheme" content="light">
  <title>CFSM Visitor Pass</title>
  <meta name="theme-color" content="#f7f1e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CFSM Visitor Pass">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234d4137'/%3E%3Cpath d='M18 42V18h8c9 0 15 4 15 12s-6 12-15 12h-4V37h4c4 0 7-2 7-7s-3-7-7-7h-1v19z' fill='%23fffdf9'/%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    :root{
      --paper:#f7f1e8;
      --paper-2:#fffdf9;
      --ink:#29231e;
      --ink-soft:#635448;
      --muted:#8a7767;
      --accent:#4d4137;
      --accent-2:#7a5f49;
      --line:rgba(91,72,57,.13);
      --success-bg:#e6efe3;
      --success:#49613d;
      --danger-bg:#f2e0da;
      --danger:#865044;
      --shadow:0 20px 50px rgba(64,45,32,.08);
      --radius:12px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    body{overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    :focus-visible{outline:3px solid rgba(107,82,61,.24);outline-offset:3px}
    .hidden{display:none!important}
    .site-shell{min-height:100svh;position:relative}
    .ambient{position:fixed;border-radius:50%;pointer-events:none;opacity:.45;z-index:-1}
    .ambient-one{width:260px;height:260px;right:-90px;top:10%;background:radial-gradient(circle,rgba(224,172,145,.24),transparent 68%)}
    .ambient-two{width:350px;height:350px;left:-150px;bottom:-140px;background:radial-gradient(circle,rgba(159,182,139,.18),transparent 68%)}
    .floral-art{position:fixed;right:3vw;bottom:0;width:min(390px,28vw);opacity:.14;pointer-events:none;z-index:-1;animation:drift 12s ease-in-out infinite alternate}
    .card-paper{background:rgba(255,252,246,.9);border:1px solid var(--line);box-shadow:var(--shadow)}
    h1,h2{font-family:Georgia,serif;font-weight:500;letter-spacing:-.04em}
    h1{font-size:clamp(2.7rem,6vw,5.7rem);line-height:.97;margin:0 0 22px}
    h1 em{font-style:normal;color:var(--accent-2)}
    p{line-height:1.65}
    .eyebrow{font-size:.74rem;letter-spacing:.22em;font-weight:700;color:#765d4a;margin:0 0 14px}
    .btn{border:0;border-radius:var(--radius);padding:13px 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .2s,box-shadow .2s,opacity .2s;background:none}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{color:#fff;background:var(--accent);box-shadow:0 11px 24px rgba(77,65,55,.18)}
    .btn-secondary{background:#eee7dd;color:var(--accent)}
    .btn-large{padding:15px 22px}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .text-button{background:none;border:0;padding:8px 0;color:#6f5946}
    .button-row{display:flex;gap:10px}
    .button-row .btn:first-child{min-width:88px}
    .button-row .btn:last-child{flex:1}
    .terms-box,.duration-callout{background:#f5efe6;border:1px solid rgba(91,72,57,.10);padding:15px;border-radius:10px}
    .terms-box{margin:18px 0}
    .terms-box strong,.duration-callout strong{display:block;margin-bottom:5px}
    .terms-box p{font-size:.78rem;color:#76665a;margin:0}
    .duration-callout{display:flex;justify-content:space-between;align-items:center;gap:18px}
    .duration-callout span{font-size:.78rem;color:#76665a;text-align:right}
    .form-error{min-height:20px;color:#8d4f43;font-size:.78rem;margin:12px 0 3px}
    .form-step-title{display:flex;gap:16px;align-items:flex-start;margin-bottom:26px}
    .form-step-title>span{font-family:Georgia,serif;color:#9b8573;font-size:1.4rem}
    .form-step-title h2{font-size:1.55rem;margin:0 0 4px}
    .form-step-title p{font-size:.8rem;color:#8a7767;margin:0}
    .optional{font-size:.7rem;color:#8b7768;margin-left:4px}
    label{display:block;font-size:.77rem;color:#655548;font-weight:700;margin:0 0 18px}
    input,select,textarea{display:block;width:100%;margin-top:8px;border:1px solid rgba(91,72,57,.16);border-radius:10px;background:#fffdf9;padding:12px 13px;color:#342b25;transition:border-color .2s,box-shadow .2s,background .2s}
    input:focus,select:focus,textarea:focus{border-color:rgba(91,72,57,.36);box-shadow:0 0 0 4px rgba(107,82,61,.06);outline:none}
    textarea{resize:vertical;min-height:88px}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-step{display:none}
    .form-step.is-active{display:block;animation:pageIn .45s cubic-bezier(.22,.78,.25,1) both}
    .hero-page,.register-page,.pass-page{width:min(1180px,calc(100% - 34px));margin:0 auto;min-height:100svh}
    .topbar{padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .topbar.compact{padding-bottom:10px}
    .brand-mark{display:flex;align-items:center;gap:10px;font-size:.82rem;letter-spacing:.16em;font-weight:800}
    .brand-line{width:22px;height:1px;background:var(--accent)}
    .institution,.step-indicator{font-size:.72rem;color:#7f6d5d}
    .hero-grid{min-height:calc(100svh - 130px);display:flex;align-items:center;padding:42px 0 80px}
    .hero-copy{max-width:780px}
    .hero-lead{max-width:640px;font-size:1.04rem;color:var(--ink-soft);margin-bottom:28px}
    .fine-print{font-size:.76rem;color:#8a7767;margin-top:14px}
    .footer-note{font-size:.7rem;color:#948175;padding:0 0 24px}
    .form-layout{display:grid;grid-template-columns:minmax(0,.8fr) minmax(360px,1fr);gap:70px;align-items:start;padding:55px 0 70px}
    .form-intro{padding-top:18px}
    .form-intro p{max-width:430px;color:#6e5d50}
    .form-card{padding:30px;background:rgba(255,253,249,.88);border:1px solid var(--line);box-shadow:var(--shadow)}
    .pass-layout{display:grid;grid-template-columns:minmax(0,.78fr) minmax(350px,.95fr);gap:70px;align-items:center;padding:55px 0 70px}
    .pass-copy{max-width:500px}
    .pass-copy>p:not(.eyebrow):not(.fine-print){color:#66564b}
    .countdown-box{border-left:2px solid #7c654f;padding:9px 0 10px 16px;margin:28px 0}
    .countdown-box span{display:block;font-size:.68rem;letter-spacing:.14em;color:#8d7969}
    .countdown-box strong{font-family:Georgia,serif;font-size:2.6rem;font-weight:500}
    .visitor-pass{padding:22px}
    .pass-header,.pass-identity,.pass-times{display:flex;justify-content:space-between;align-items:center;gap:15px}
    .pass-header{font-size:.63rem;letter-spacing:.1em;color:#8e7b6b;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .pass-identity{padding:22px 0}
    .pass-identity h2{font-size:1.8rem;margin:6px 0 0}
    .pass-status-mini{font-size:.64rem;letter-spacing:.12em;font-weight:800;color:var(--success)}
    .pass-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:22px}
    .label{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:#8b7768}
    .pass-grid strong{display:block;margin-top:6px;font-size:.95rem;word-break:break-word}
    .qr-wrap{min-height:270px;display:flex;justify-content:center;align-items:center;background:#fbf6ef;padding:18px}
    .qr-image{width:min(270px,78vw);height:auto;display:block;animation:qrIn .45s ease-out both}
    .qr-skeleton{font-size:.82rem;color:#887467;text-align:center}
    .pass-times{padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .pass-times strong{display:block;font-size:.82rem;margin-top:5px}
    .pass-footer{text-align:center;font-size:.66rem;color:#8f7c6d;margin:14px 0 0}
    .pill{padding:6px 10px;border-radius:999px;font-size:.68rem;letter-spacing:.12em;font-weight:800}
    .pill-active{background:var(--success-bg);color:var(--success)}
    .pill-expired{background:var(--danger-bg);color:var(--danger)}
    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;padding:11px 16px;border-radius:10px;background:#342b25;color:#fff;font-size:.82rem;box-shadow:0 12px 30px rgba(0,0,0,.16);max-width:min(92vw,520px);animation:toastIn .3s ease-out both}
    .toast.toast-error{background:#7d4b40}
    .soft-rule{height:1px;background:var(--line);margin:22px 0}
    .api-note{font-size:.68rem;color:#947f70;margin-top:12px}
    @media(max-width:900px){
      .hero-grid,.form-layout,.pass-layout{grid-template-columns:1fr;gap:34px}
      .hero-grid{padding-top:30px}
      .form-intro{padding-top:0}
      .floral-art{width:min(260px,60vw);opacity:.1}
    }
    @media(max-width:560px){
      .hero-page,.register-page,.pass-page{width:min(100% - 22px,1180px)}
      .topbar{padding:18px 0}
      .institution{display:none}
      .hero-grid{min-height:auto;padding:55px 0 60px}
      .form-layout,.pass-layout{padding:34px 0 55px}
      .form-card,.visitor-pass{padding:20px}
      .qr-wrap{min-height:220px}
      .countdown-box strong{font-size:2.15rem}
      .two-col{grid-template-columns:1fr}
      .pass-grid{gap:14px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
    @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes drift{to{transform:translateY(-9px)}}
    @keyframes qrIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  </style>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <svg class="floral-art" viewBox="0 0 420 620" fill="none" aria-hidden="true">
    <path d="M255 620c-5-92 15-146 61-191 42-41 54-78 38-116M214 608c18-79 11-131-17-170-28-40-50-68-41-108" stroke="#6b5848" stroke-width="3"/>
    <path d="M304 434c-16-23-13-47 6-66 26 9 42 28 43 55-13 14-28 18-49 11ZM166 412c-23-8-36-25-38-49 22-15 45-13 63 7 2 18-7 31-25 42Z" stroke="#7a6653" stroke-width="2"/>
    <rect x="95" y="210" width="154" height="102" rx="9" stroke="#6f5b4a" stroke-width="2"/>
    <path d="M116 239h113M116 264h113M116 289h113M137 210v102M160 210v102M184 210v102M207 210v102" stroke="#6f5b4a" stroke-width="2"/>
    <circle cx="290" cy="182" r="14" stroke="#6f5b4a" stroke-width="2"/>
    <path d="M290 196v64M290 260c-10 24-8 35 7 45M282 261c-21 9-34 26-38 51M289 214c22 5 33 19 33 41" stroke="#6f5b4a" stroke-width="2"/>
    <path d="M315 90c8-11 16-11 24-2-2 11-8 17-17 19-8-4-10-9-7-17ZM272 106c7-8 14-8 20 0-1 9-6 15-14 17-7-3-9-8-6-17Z" stroke="#8b7768" stroke-width="2"/>
  </svg>

  <main id="app" class="site-shell"></main>

  <script type="module">
    'use strict';

    const PASS_STORAGE_KEY = 'cfsm_pass';
    let countdownTimer = null;

    const $ = (id) => document.getElementById(id);

    function toast(message, type = 'info') {
      document.querySelectorAll('.toast').forEach((node) => node.remove());
      const node = document.createElement('div');
      node.className = `toast${type === 'error' ? ' toast-error' : ''}`;
      node.setAttribute('role', 'status');
      node.textContent = message;
      document.body.appendChild(node);
      window.setTimeout(() => node.remove(), 3200);
    }

    function formatDate(value) {
      try { return new Date(value).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}); }
      catch { return value || ''; }
    }

    function setHash(route) {
      window.location.hash = `#${route}`;
    }

    function bindRouteButtons() {
      document.querySelectorAll('[data-route]').forEach((button) => {
        button.addEventListener('click', () => setHash(button.dataset.route));
      });
    }

    const DEFAULT_PURPOSES = [
      ['Meeting', 60],
      ['Delivering Lunchbox', 20],
      ['Pick Up Student', 30],
      ['Pay S.O.A.', 45],
      ['Submit Documents', 30],
      ['Claim Documents', 30],
      ['Parent/Guardian Concern', 45],
      ['Appointment', 60],
      ['School Business', 60],
      ['Other', 30]
    ];

    let db = null;
    let purposes = [];
    let dbReady = null;

    async function initDatabase() {
      if (dbReady) return dbReady;
      dbReady = (async () => {
        const sqlModule = await import('https://sql.js.org/js/sql-wasm.js');
        const SQL = await sqlModule.initSqlJs({ locateFile: (file) => 'https://sql.js.org/js/' + file });
        const database = new SQL.Database();
        database.run("CREATE TABLE IF NOT EXISTS purposes(id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL UNIQUE COLLATE NOCASE, duration_minutes INTEGER NOT NULL CHECK(duration_minutes BETWEEN 1 AND 1440), active INTEGER NOT NULL DEFAULT 1, created_at TEXT NOT NULL, updated_at TEXT NOT NULL)");
        database.run("CREATE TABLE IF NOT EXISTS visitors(id INTEGER PRIMARY KEY AUTOINCREMENT, temporary_code TEXT NOT NULL UNIQUE, token_hash TEXT NOT NULL UNIQUE, full_name TEXT NOT NULL, age INTEGER NOT NULL CHECK(age BETWEEN 1 AND 120), gender TEXT NOT NULL, purpose_id INTEGER NOT NULL, additional_info TEXT, issued_at TEXT NOT NULL, expires_at TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'ACTIVE', created_at TEXT NOT NULL, FOREIGN KEY(purpose_id) REFERENCES purposes(id))");
        const now = new Date().toISOString();
        DEFAULT_PURPOSES.forEach(([name, duration]) => {
          database.run('INSERT OR IGNORE INTO purposes(name, duration_minutes, active, created_at, updated_at) VALUES(?,?,?,?,?)', [name, duration, 1, now, now]);
        });
        const result = database.exec('SELECT id, name, duration_minutes FROM purposes WHERE active = 1');
        purposes = result.length ? result[0].values.map((row) => ({id: row[0], name: row[1], duration_minutes: row[2]})) : [];
        db = database;
        return true;
      })();
      return dbReady;
    }

    function simpleHash(text) {
      let h = 5381;
      for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
      return 'h' + (h >>> 0).toString(16);
    }

    function makeTemporaryCode(database) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      const check = database.exec("SELECT 1 FROM visitors WHERE temporary_code = '" + code + "'");
      if (check.length) return makeTemporaryCode(database);
      return 'CFSM-' + code;
    }

    async function createPass(payload) {
      const fullName = String(payload.full_name || '').trim();
      const age = Number(payload.age);
      const gender = String(payload.gender || '');
      const additionalInfo = String(payload.additional_info || '').trim();
      const purpose = purposes.find((item) => String(item.id) === String(payload.purpose_id));
      if (fullName.length < 2) throw new Error('Full name is required.');
      if (!Number.isInteger(age) || age < 1 || age > 120) throw new Error('Please enter a valid age between 1 and 120.');
      if (!gender) throw new Error('Select a gender.');
      if (!purpose) throw new Error('Selected purpose is unavailable.');
      const issued = new Date().toISOString();
      const expires = new Date(Date.now() + purpose.duration_minutes * 60000).toISOString();
      const token = 'tok_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      const tokenHash = simpleHash(token);
      const temporaryCode = makeTemporaryCode(db);
      db.run("INSERT INTO visitors(temporary_code, token_hash, full_name, age, gender, purpose_id, additional_info, issued_at, expires_at, status, created_at) VALUES(?,?,?,?,?,?,?,?,?,'ACTIVE',?)",
        [temporaryCode, tokenHash, fullName, age, gender, purpose.id, additionalInfo || null, issued, expires, issued]);
      return {
        temporary_code: temporaryCode,
        token: token,
        full_name: fullName,
        age: age,
        gender: gender,
        purpose: purpose.name,
        issued_at: issued,
        expires_at: expires,
        status: 'ACTIVE'
      };
    }

    function renderQr(text) {
      const host = document.getElementById('qrImage');
      if (!host) return;
      host.innerHTML = '';
      const qr = new QRCode(host, { text: text, width: 512, height: 512, colorDark: '#29231e', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
      qr.make();
    }
    function homePage() {
      return `
        <section class="hero-page page-enter">
          <header class="topbar">
            <div class="brand-mark"><span class="brand-line"></span>CFSM</div>
            <span class="institution">Children of Fatima School of Mabalacat, Inc.</span>
          </header>

          <div class="hero-grid">
            <div class="hero-copy">
              <p class="eyebrow">VISITOR PASS</p>
              <h1>Enter with clarity.<br><em>Leave with confidence.</em></h1>
              <p class="hero-lead">Request your temporary visitor pass before entering the school. Your QR code is time-limited and verified by authorized school personnel.</p>
              <button class="btn btn-primary btn-large" data-route="register" type="button">Request visitor pass</button>
              <p class="fine-print">Your pass is temporary. Keep the QR visible on your phone while on campus.</p>
            </div>

          </div>

          <footer class="footer-note">CFSM Visitor Pass &#183; Secure registration</footer>
        </section>`;
    }

    function registerPage() {
      return `
        <section class="register-page page-enter">
          <header class="topbar compact">
            <button class="text-button" data-route="home" type="button">Back</button>
            <div class="brand-mark"><span class="brand-line"></span>CFSM</div>
            <span class="step-indicator" id="stepIndicator" aria-live="polite">1 / 2</span>
          </header>

          <div class="form-layout">
            <div class="form-intro">
              <p class="eyebrow">VISITOR REGISTRATION</p>
              <h1>Let&rsquo;s prepare<br><em>your temporary pass.</em></h1>
              <p>Your information is used to create the visitor record that school personnel verify at entry.</p>
            </div>

            <form id="visitorForm" class="form-card" novalidate>
              <div class="form-step is-active" data-step="1">
                <div class="form-step-title">
                  <span>01</span>
                  <div><h2>Personal information</h2><p>Tell us who is visiting.</p></div>
                </div>

                <label for="fullName">Full Name
                  <input id="fullName" name="full_name" maxlength="120" autocomplete="name" required placeholder="Juan Dela Cruz">
                </label>

                <div class="two-col">
                  <label for="age">Age
                    <input id="age" name="age" type="number" inputmode="numeric" min="1" max="120" required placeholder="18">
                  </label>
                  <label for="gender">Gender
                    <select id="gender" name="gender" required>
                      <option value="">Select</option>
                      <option>Female</option>
                      <option>Male</option>
                      <option>Non-binary</option>
                      <option>Prefer not to say</option>
                    </select>
                  </label>
                </div>

                <label for="additionalInfo">Additional information <span class="optional">Optional</span>
                  <textarea id="additionalInfo" name="additional_info" maxlength="500" rows="3" placeholder="Anything the school should know about this visit."></textarea>
                </label>

                <p class="form-error" id="step1Error" role="alert" aria-live="assertive"></p>
                <button class="btn btn-primary" type="button" id="continueStep">Continue</button>
              </div>

              <div class="form-step" data-step="2">
                <div class="form-step-title">
                  <span>02</span>
                  <div><h2>Purpose of visit</h2><p>Your pass duration is set by the school.</p></div>
                </div>

                <label for="purposeSelect">Purpose
                  <select name="purpose_id" id="purposeSelect" required>
                    <option value="">Loading purposes...</option>
                  </select>
                </label>

                <div class="duration-callout" id="durationCallout" aria-live="polite">
                  <strong>Pass duration</strong>
                  <span>Choose a purpose to see the configured duration.</span>
                </div>

                <div class="terms-box">
                  <strong>Before you continue</strong>
                  <p>The QR code expires automatically based on the selected purpose. Never share your temporary code with another person.</p>
                </div>

                <p class="form-error" id="step2Error" role="alert" aria-live="assertive"></p>
                <div class="button-row">
                  <button class="btn btn-secondary" type="button" id="backStep">Back</button>
                  <button class="btn btn-primary" type="submit" id="submitVisitor">Create temporary pass</button>
                </div>
                <p class="api-note">Pass duration is calculated and enforced by the school server.</p>
              </div>
            </form>
          </div>
        </section>`;
    }
    function passPage() {
      return `
        <section class="pass-page page-enter">
          <header class="topbar compact">
            <button class="text-button" data-route="home" type="button">New visitor pass</button>
            <div class="brand-mark"><span class="brand-line"></span>CFSM</div>
            <span class="pill pill-active" id="passStatus">ACTIVE</span>
          </header>

          <div class="pass-layout">
            <div class="pass-copy">
              <p class="eyebrow">YOUR TEMPORARY VISITOR PASS</p>
              <h1>Keep this pass<br><em>ready at the gate.</em></h1>
              <p>Your QR code is the secure reference used by authorized school personnel. The server remains the source of truth for validity.</p>
              <div class="countdown-box">
                <span>QR VALID FOR</span>
                <strong id="countdown" aria-live="polite">--:--:--</strong>
              </div>
              <p class="fine-print" id="passMessage">Present the QR code clearly when requested.</p>
            </div>

            <article class="visitor-pass card-paper" aria-label="Temporary visitor pass">
              <div class="pass-header"><span>CHILDREN OF FATIMA SCHOOL</span><span>CFSM</span></div>
              <div class="pass-identity">
                <div><span class="label">VISITOR</span><h2 id="passName">--</h2></div>
                <div class="pass-status-mini" id="passStatusMini">ACTIVE</div>
              </div>
              <div class="pass-grid">
                <div><span class="label">AGE</span><strong id="passAge">--</strong></div>
                <div><span class="label">GENDER</span><strong id="passGender">--</strong></div>
                <div><span class="label">PURPOSE</span><strong id="passPurpose">--</strong></div>
                <div><span class="label">CODE</span><strong id="passCode">--</strong></div>
              </div>
              <div class="qr-wrap">
                <div class="qr-skeleton" id="qrLoading">Generating secure QR...</div>
                <div id="qrImage" class="qr-image"></div>
              </div>
              <div class="pass-times">
                <div><span class="label">ISSUED</span><strong id="passIssued">--</strong></div>
                <div><span class="label">EXPIRES</span><strong id="passExpires">--</strong></div>
              </div>
              <p class="pass-footer">Temporary visitor authorization &#183; Do not share</p>
              <div class="button-row">
                <button class="btn btn-secondary" id="copyCodeButton" type="button">Copy temporary code</button>
                <button class="btn btn-secondary" id="downloadQrButton" type="button">Download QR</button>
              </div>
            </article>
          </div>
        </section>`;
    }

    async function initRegister() {
      const form = $('visitorForm');
      const steps = [...document.querySelectorAll('.form-step')];
      const indicator = $('stepIndicator');
      const select = $('purposeSelect');
      const duration = $('durationCallout');
      let step = 1;

      const setStep = (next) => {
        step = next;
        steps.forEach((item) => item.classList.toggle('is-active', Number(item.dataset.step) === step));
        indicator.textContent = `${step} / 2`;
        window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
      };

      const validateStep1 = () => {
        const name = String(form.full_name.value || '').trim();
        const age = Number(form.age.value);
        const gender = String(form.gender.value || '');
        const error = $('step1Error');
        error.textContent = '';
        if (name.length < 2) { error.textContent = 'Enter your full name.'; return false; }
        if (!/^[\p{L}\p{M}\s.,'’-]+$/u.test(name)) { error.textContent = 'Use letters, spaces, apostrophes, periods, or hyphens in your name.'; return false; }
        if (name.length > 120) { error.textContent = 'Full name is too long.'; return false; }
        if (!Number.isInteger(age) || age < 1 || age > 120) { error.textContent = 'Enter a valid age between 1 and 120.'; return false; }
        if (!gender) { error.textContent = 'Select a gender.'; return false; }
        return true;
      };

      $('continueStep').addEventListener('click', () => {
        if (validateStep1()) setStep(2);
      });
      $('backStep').addEventListener('click', () => setStep(1));

      select.addEventListener('change', () => {
        const selected = select.options[select.selectedIndex];
        const mins = Number(selected?.dataset.duration || 0);
        duration.innerHTML = mins > 0
          ? `<strong>Pass duration</strong><span>${mins} minute${mins === 1 ? '' : 's'}</span>`
          : '<strong>Pass duration</strong><span>Choose a purpose to see the configured duration.</span>';
      });

      await initDatabase();
      select.replaceChildren(new Option('Select a purpose', ''));
      purposes.forEach((purpose) => {
        const option = new Option(purpose.name, purpose.id);
        option.dataset.duration = purpose.duration_minutes;
        select.appendChild(option);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const errorBox = $('step2Error');
        errorBox.textContent = '';
        if (!select.value) { errorBox.textContent = 'Select a purpose.'; return; }

        const button = $('submitVisitor');
        const original = button.innerHTML;
        button.disabled = true;
        button.textContent = 'Creating pass...';

        const payload = {
          full_name: String(form.full_name.value || '').trim(),
          age: Number(form.age.value),
          gender: String(form.gender.value || ''),
          additional_info: String(form.additional_info.value || '').trim(),
          purpose_id: Number(select.value)
        };

        try {
          const visitor = await createPass(payload);
          sessionStorage.setItem(PASS_STORAGE_KEY, JSON.stringify(visitor));
          setHash('pass');
        } catch (error) {
          errorBox.textContent = error.message;
          button.disabled = false;
          button.innerHTML = original;
        }
      });
    }

    function setPassStatus(status) {
      const statusEl = $('passStatus');
      const mini = $('passStatusMini');
      const isExpired = status === 'EXPIRED';
      statusEl.textContent = status;
      statusEl.className = `pill ${isExpired ? 'pill-expired' : 'pill-active'}`;
      mini.textContent = status;
      mini.style.color = isExpired ? 'var(--danger)' : 'var(--success)';
    }

    function initPass() {
      const stored = sessionStorage.getItem(PASS_STORAGE_KEY);
      if (!stored) { setHash('home'); return; }

      let data;
      try { data = JSON.parse(stored); } catch { sessionStorage.removeItem(PASS_STORAGE_KEY); setHash('home'); return; }

      $('passName').textContent = data.full_name || '--';
      $('passAge').textContent = data.age ?? '--';
      $('passGender').textContent = data.gender || '--';
      $('passPurpose').textContent = data.purpose || '--';
      $('passCode').textContent = data.temporary_code || '--';
      $('passIssued').textContent = formatDate(data.issued_at);
      $('passExpires').textContent = formatDate(data.expires_at);

      renderQr(data.temporary_code);
      $('qrLoading').classList.add('hidden');

      const copyButton = $('copyCodeButton');
      if (copyButton) {
        copyButton.addEventListener('click', async () => {
          const code = String($('passCode').textContent || '').trim();
          try {
            await navigator.clipboard.writeText(code);
            toast('Temporary code copied.', 'info');
          } catch {
            toast('Copy unavailable. Your code is: ' + code, 'info');
          }
        });
      }

      const downloadButton = $('downloadQrButton');
      if (downloadButton) {
        downloadButton.addEventListener('click', () => {
          const host = document.getElementById('qrImage');
          const canvas = host ? host.querySelector('canvas') : null;
          if (!canvas) { toast('QR code is not ready yet.', 'error'); return; }
          const size = 1024;
          const exportCanvas = document.createElement('canvas');
          exportCanvas.width = size;
          exportCanvas.height = size;
          const ctx = exportCanvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, size, size);
          const scale = size / canvas.width;
          ctx.drawImage(canvas, 0, 0, canvas.width * scale, canvas.height * scale);
          exportCanvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'visitor-qr.png';
            link.click();
            URL.revokeObjectURL(url);
          }, 'image/png');
        });
      }

      if (countdownTimer) clearInterval(countdownTimer);
      const tick = () => {
        const ms = new Date(data.expires_at).getTime() - Date.now();
        const countdown = $('countdown');
        if (!Number.isFinite(ms) || ms <= 0) {
          countdown.textContent = '00:00:00';
          setPassStatus('EXPIRED');
          $('passMessage').textContent = 'This pass has expired. Request a new temporary visitor pass.';
          clearInterval(countdownTimer);
          return;
        }
        const totalSeconds = Math.floor(ms / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2,'0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,'0');
        const seconds = String(Math.floor(totalSeconds % 60)).padStart(2,'0');
        countdown.textContent = `${hours}:${minutes}:${seconds}`;
      };
      setPassStatus(data.status === 'EXPIRED' ? 'EXPIRED' : 'ACTIVE');
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    async function loadRoute() {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      const route = (location.hash.replace(/^#/, '') || 'home').toLowerCase();
      const app = $('app');
      if (route === 'register') {
        app.innerHTML = registerPage();
        bindRouteButtons();
        await initRegister();
        return;
      }
      if (route === 'pass') {
        app.innerHTML = passPage();
        bindRouteButtons();
        initPass();
        return;
      }
      app.innerHTML = homePage();
      bindRouteButtons();
    }

    window.addEventListener('hashchange', loadRoute);
    window.addEventListener('DOMContentLoaded', loadRoute);

    await initDatabase();
    loadRoute();
  </script>
</body>
</html>
